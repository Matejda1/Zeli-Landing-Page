<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/style.css">

<body>

    <section class="form-section">
        <h2>Rezervace</h2>
        <p>Vyplňte formulář níže a já se vám ozvu co nejdříve pro potvrzení.</p>
        <form id="my-form" method="POST"
            action="https://script.google.com/macros/s/AKfycbxa-7QTtQRy1uWoH1_gNmtak4iLKiPtYtFrV8J-p7R0brS_PYHDy3VkSAEvKgET-c2Y/exec">
            <div class="form-field">
                <label for="name"><svg xmlns="http://www.w3.org/2000/svg" height="20" width="20"
                        viewBox="0 0 640 640"><!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
                        <path fill="rgb(0, 48, 135)"
                            d="M240 192C240 147.8 275.8 112 320 112C364.2 112 400 147.8 400 192C400 236.2 364.2 272 320 272C275.8 272 240 236.2 240 192zM448 192C448 121.3 390.7 64 320 64C249.3 64 192 121.3 192 192C192 262.7 249.3 320 320 320C390.7 320 448 262.7 448 192zM144 544C144 473.3 201.3 416 272 416L368 416C438.7 416 496 473.3 496 544L496 552C496 565.3 506.7 576 520 576C533.3 576 544 565.3 544 552L544 544C544 446.8 465.2 368 368 368L272 368C174.8 368 96 446.8 96 544L96 552C96 565.3 106.7 576 120 576C133.3 576 144 565.3 144 552L144 544z" />

                <input type="text" id="name" name="name" placeholder="Jan Novák" required>
            </div>
            <div class="form-field">
                <label for="email"><svg xmlns="http://www.w3.org/2000/svg" height="20" width="20"
                        viewBox="0 0 640 640"><!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
                        <path fill="rgb(0, 48, 135)"
                            d="M125.4 128C91.5 128 64 155.5 64 189.4C64 190.3 64 191.1 64.1 192L64 192L64 448C64 483.3 92.7 512 128 512L512 512C547.3 512 576 483.3 576 448L576 192L575.9 192C575.9 191.1 576 190.3 576 189.4C576 155.5 548.5 128 514.6 128L125.4 128zM528 256.3L528 448C528 456.8 520.8 464 512 464L128 464C119.2 464 112 456.8 112 448L112 256.3L266.8 373.7C298.2 397.6 341.7 397.6 373.2 373.7L528 256.3zM112 189.4C112 182 118 176 125.4 176L514.6 176C522 176 528 182 528 189.4C528 193.6 526 197.6 522.7 200.1L344.2 335.5C329.9 346.3 310.1 346.3 295.8 335.5L117.3 200.1C114 197.6 112 193.6 112 189.4z" />

                <input type="email" name="email" id="email" placeholder="jan.novak@email.cz" required>
            </div>
            <div class="form-field">
                <label for="number"><svg xmlns="http://www.w3.org/2000/svg" height="20" width="20"
                        viewBox="0 0 640 640"><!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
                        <path fill="rgb(0, 48, 135)"

                    </svg> Telefon</label>
                <input type="tel" name="number" id="number" placeholder="+420 123 456 789" required>
            </div>
            <div class="form-field">
                <label for="service"><svg xmlns="http://www.w3.org/2000/svg" height="20" width="20"
                        viewBox="0 0 640 640"><!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
                        <path fill="rgb(0, 48, 135)"
                            d="M267.7 576.9C267.7 576.9 267.7 576.9 267.7 576.9L229.9 603.6C222.6 608.8 213 609.4 205 605.3C197 601.2 192 593 192 584L192 512L160 512C107 512 64 469 64 416L64 192C64 139 107 96 160 96L480 96C533 96 576 139 576 192L576 416C576 469 533 512 480 512L359.6 512L267.7 576.9zM332 472.8C340.1 467.1 349.8 464 359.7 464L480 464C506.5 464 528 442.5 528 416L528 192C528 165.5 506.5 144 480 144L160 144C133.5 144 112 165.5 112 192L112 416C112 442.5 133.5 464 160 464L216 464C226.4 464 235.3 470.6 238.6 479.9C239.5 482.4 240 485.1 240 488L240 537.7C272.7 514.6 303.3 493 331.9 472.8z" />
                    </svg> Typ služby</label>
                <select name="service" id="service">
                    <option value="Individualni-clenstvi">Individuální členství</option>
                    <option value="Klubove-clenství">Klubové členství</option>
                    <option value="Privatni-lekce">Privátní lekce</option>
                </select>
            </div>
            <div class="form-field-full">
                <label for="message"><svg xmlns="http://www.w3.org/2000/svg" height="20" width="20"
                        viewBox="0 0 640 640"><!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
                        <path fill="rgb(0, 48, 135)"
                            d="M267.7 576.9C267.7 576.9 267.7 576.9 267.7 576.9L229.9 603.6C222.6 608.8 213 609.4 205 605.3C197 601.2 192 593 192 584L192 512L160 512C107 512 64 469 64 416L64 192C64 139 107 96 160 96L480 96C533 96 576 139 576 192L576 416C576 469 533 512 480 512L359.6 512L267.7 576.9zM332 472.8C340.1 467.1 349.8 464 359.7 464L480 464C506.5 464 528 442.5 528 416L528 192C528 165.5 506.5 144 480 144L160 144C133.5 144 112 165.5 112 192L112 416C112 442.5 133.5 464 160 464L216 464C226.4 464 235.3 470.6 238.6 479.9C239.5 482.4 240 485.1 240 488L240 537.7C272.7 514.6 303.3 493 331.9 472.8z" />
                    </svg> Zpráva (volitelné)</label>
                <textarea id="message" name="message"
                    placeholder="Napište mi něco o vašich cílech a zkušenostech..."></textarea>
            </div>
            <div class="form-field-full">
                <input type="submit" value="Odeslat rezervaci" id="submit">
            </div>
        </form>
        <p id="Send">Váš formulář byl úspěšně odeslán.</p>
    </section>

    <footer>
        <p>© <span id="FooterYear"></span> Martin Zelenka CompleteCatchersCo. Všechna práva vyhrazena.</p>
    </footer>

    <script>
        let nameO = document.getElementById("name");
        let email = document.getElementById("email");
        let number = document.getElementById("number");
        let message = document.getElementById("message");

        window.addEventListener("load", function () {
            const form = document.getElementById('my-form');
            form.addEventListener("submit", function (e) {
                let btn = document.getElementById("submit")
                btn.disabled = true;    
                e.preventDefault();
                const data = new FormData(form);
                const action = e.target.action;
                fetch(action, {
                    method: 'POST',
                    body: data,
                })
                    .then(() => {
                        let Send = document.getElementById("Send").style.display = "block";
                        btn.disabled = false;
                        nameO.value = "";
                        email.value = "";
                        number.value = "";
                        message.value = "";
                    })
            });
        });

        let YearO = document.getElementById("FooterYear")
        let ADate = new Date().getFullYear()
        YearO.innerHTML = ADate

    </script>
</body>

</html>
